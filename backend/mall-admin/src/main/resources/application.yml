server:
  port: 8081
spring:
  application:
    name: mall-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: "521131"
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

mall:
  jwt:
    secret: mall-jwt-secret-change-me-please-0123456789abcdef
    expire-millis: 604800000
  order:
    # 未支付订单有效期（分钟）：下单时写入 t_order.expire_time
    expire-minutes: 30
    timeout-job:
      # 超时关单定时任务：只在 mall-admin 打开，避免两个应用重复扫同一批订单
      enabled: true
      # 扫描间隔：开发环境 10 秒便于验证，生产建议调大（如 60000）
      interval-millis: 10000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
knife4j:
  enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
