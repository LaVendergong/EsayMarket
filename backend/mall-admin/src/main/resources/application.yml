server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: mall-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${MALL_DB_URL:jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}"
    username: ${MALL_DB_USERNAME:root}
    # 开发默认值；生产用 prod profile（见文件末尾），不给默认值，缺环境变量直接启动失败
    password: "${MALL_DB_PASSWORD:521131}"
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

mall:
  jwt:
    # 开发默认值明确标了 INSECURE；生产走 prod profile 强制注入真实随机值
    secret: ${MALL_JWT_SECRET:mall-dev-only-INSECURE-secret-0123456789abcdef}
    expire-millis: ${MALL_JWT_EXPIRE_MILLIS:604800000}
  order:
    # 未支付订单有效期（分钟）：下单时写入 t_order.expire_time
    expire-minutes: ${MALL_ORDER_EXPIRE_MINUTES:30}
    timeout-job:
      # 超时关单定时任务：默认开，且 mall-portal 也开（重复扫描是安全的，见 OrderTimeoutTask）
      enabled: ${MALL_ORDER_TIMEOUT_JOB_ENABLED:true}
      # 扫描间隔：开发环境 10 秒便于验证，生产建议调大（如 60000）
      interval-millis: ${MALL_ORDER_TIMEOUT_JOB_INTERVAL_MILLIS:10000}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
knife4j:
  enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# ============================================================
# 生产 profile：--spring.profiles.active=prod
#
# 这里只做「关掉不该对外暴露的东西」。敏感配置项的 fail-fast 校验**不能只靠 YAML**：
# Spring Boot 在 @ConfigurationProperties 绑定路径上会把解析不了的占位符原样保留
# （实测 `${MALL_JWT_SECRET}` 没注入时会变成字面量、应用照样启动），
# 所以真正的校验在 com.mall.core.config.ProductionConfigGuard —— 它在 prod 下校验
# mall.jwt.secret / spring.datasource.password 不是空、不是未解析占位符、不是开发默认值，
# 不满足就让应用启动失败。
# ============================================================
---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  enable: false
management:
  endpoints:
    web:
      exposure:
        include: health
