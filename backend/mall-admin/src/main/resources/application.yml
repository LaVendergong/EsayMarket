server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: mall-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${MALL_DB_URL:jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}"
    username: ${MALL_DB_USERNAME:root}
    # 开发默认值；生产用 prod profile（见文件末尾），不给默认值，缺环境变量直接启动失败
    password: "${MALL_DB_PASSWORD:521131}"
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

mall:
  jwt:
    # 开发默认值明确标了 INSECURE；生产走 prod profile 强制注入真实随机值
    secret: ${MALL_JWT_SECRET:mall-dev-only-INSECURE-secret-0123456789abcdef}
    # access token 只活 15 分钟（无状态、不可吊销 -> 越短越安全）
    access-expire-millis: ${MALL_JWT_ACCESS_EXPIRE_MILLIS:900000}
    # refresh token 7 天，存库、可吊销、用一次即换新
    refresh-expire-millis: ${MALL_JWT_REFRESH_EXPIRE_MILLIS:604800000}
  order:
    # 未支付订单有效期（分钟）：下单时写入 t_order.expire_time
    expire-minutes: ${MALL_ORDER_EXPIRE_MINUTES:30}
    timeout-job:
      # 超时关单定时任务：默认开，且 mall-portal 也开（重复扫描是安全的，见 OrderTimeoutTask）
      enabled: ${MALL_ORDER_TIMEOUT_JOB_ENABLED:true}
      # 扫描间隔：开发环境 10 秒便于验证，生产建议调大（如 60000）
      interval-millis: ${MALL_ORDER_TIMEOUT_JOB_INTERVAL_MILLIS:10000}
  coupon:
    expire-job:
      # 过期券状态纠正（0 未使用 → 2 已过期），与 portal 一样默认开
      enabled: ${MALL_COUPON_EXPIRE_JOB_ENABLED:true}
      interval-millis: ${MALL_COUPON_EXPIRE_JOB_INTERVAL_MILLIS:3600000}
  cors:
    # 允许跨域的来源（逗号分隔）。生产用环境变量覆盖成真实域名，**绝不能写 "*"**
    #（本项目开着 allowCredentials，通配来源 + 携带凭证 = 任意站点都能拿用户身份调后端）
    allowed-origins: ${MALL_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
  security:
    login:
      # 登录失败限流：窗口内失败 max-failures 次就锁 lock-seconds 秒。
      # 计数在进程内存里，多副本部署要换成共享存储（否则上限会被放大到「副本数 × max-failures」）
      max-failures: ${MALL_LOGIN_MAX_FAILURES:5}
      lock-seconds: ${MALL_LOGIN_LOCK_SECONDS:300}
    cookie:
      # 登录态 Cookie（HttpOnly，JS 读不到，XSS 偷不走）。dev 是 http 所以必须 false；
      # **prod 必须 true**（ProductionConfigGuard 会拦，因为 prod 必须在 TLS 后面）
      secure: ${MALL_COOKIE_SECURE:false}
      same-site: Lax
      max-age-seconds: ${MALL_COOKIE_MAX_AGE:604800}
  crypto:
    # 敏感字段（手机号/收货人/地址）加密主密钥。**必须与 JWT 密钥分开**：
    # 签名密钥泄露只影响 token，不该连带把库里所有 PII 一起交出去。
    # 生产用 MALL_CRYPTO_SECRET 注入；⚠️ 换了密钥旧密文就解不开，轮换要走双密钥流程
    secret: ${MALL_CRYPTO_SECRET:mall-dev-only-INSECURE-crypto-secret-0123456789abcdef}
    # 启动时把库里残留的明文 PII 加密（幂等；两个应用同时跑也安全）
    migrate-on-startup: ${MALL_CRYPTO_MIGRATE_ON_STARTUP:true}
    # 仅用于**解密**的历史密钥（逗号分隔），密钥轮换过渡期用；重加密完成后必须清空
    previous-secrets: ${MALL_CRYPTO_PREVIOUS_SECRETS:}
    # 一次性运维开关：启动时把仍在历史密钥下的密文重加密成当前密钥。平时保持 false
    # 一次性运维开关：启动时把仍在历史密钥下的密文重加密成当前密钥。平时保持 false
    re-encrypt-on-startup: ${MALL_CRYPTO_RE_ENCRYPT_ON_STARTUP:false}
  pay:
    # 模拟支付渠道：本地/测试用。**prod 必须 false**，否则任何人都能把自己的订单"付"成已支付
    mock-enabled: ${MALL_PAY_MOCK_ENABLED:true}
    expire-minutes: ${MALL_PAY_EXPIRE_MINUTES:30}
    # 支付宝手机网站支付：填了 appId + 应用私钥 + 支付宝公钥才算「可用」
    alipay:
      app-id: ${MALL_PAY_ALIPAY_APP_ID:}
      private-key: ${MALL_PAY_ALIPAY_PRIVATE_KEY:}
      public-key: ${MALL_PAY_ALIPAY_PUBLIC_KEY:}
      gateway: ${MALL_PAY_ALIPAY_GATEWAY:https://openapi.alipay.com/gateway.do}
      notify-url: ${MALL_PAY_ALIPAY_NOTIFY_URL:}
      return-url: ${MALL_PAY_ALIPAY_RETURN_URL:}
    # 微信 Native 扫码：需要 mchId + 证书序列号 + 商户私钥；回调验签还要平台证书
    wechat:
      app-id: ${MALL_PAY_WECHAT_APP_ID:}
      mch-id: ${MALL_PAY_WECHAT_MCH_ID:}
      serial-no: ${MALL_PAY_WECHAT_SERIAL_NO:}
      private-key: ${MALL_PAY_WECHAT_PRIVATE_KEY:}
      api-v3-key: ${MALL_PAY_WECHAT_API_V3_KEY:}
      platform-cert: ${MALL_PAY_WECHAT_PLATFORM_CERT:}
      api-base: ${MALL_PAY_WECHAT_API_BASE:https://api.mch.weixin.qq.com}
      notify-url: ${MALL_PAY_WECHAT_NOTIFY_URL:}
      allow-unverified-notify: ${MALL_PAY_WECHAT_ALLOW_UNVERIFIED_NOTIFY:false}
    # 退款对账兜底：定期查「退款中」的单（两个应用都会扫描，只在一个应用开，避免重复执行）
    refund-reconcile:
      enabled: ${MALL_PAY_REFUND_RECONCILE_ENABLED:false}
      interval-millis: ${MALL_PAY_REFUND_RECONCILE_INTERVAL_MILLIS:300000}
    # 支付对账兜底：把「钱付了但回调丢了」的订单捞回来（同样只在一个应用开）
    payment-reconcile:
      enabled: ${MALL_PAY_PAYMENT_RECONCILE_ENABLED:false}
      interval-millis: ${MALL_PAY_PAYMENT_RECONCILE_INTERVAL_MILLIS:120000}

# 日志只打 stdout，格式在 backend/mall-core/src/main/resources/logback-spring.xml 里；
# 目录/轮转交给运行环境（docker 的 json-file 上限见 docker-compose.yml，裸机交给 logrotate）。
# 自定义了 logback-spring.xml 之后，这里的 logging.pattern.* 不再生效，别再写回来。

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
knife4j:
  enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

# ============================================================
# 生产 profile：--spring.profiles.active=prod
#
# 这里只做「关掉不该对外暴露的东西」。敏感配置项的 fail-fast 校验**不能只靠 YAML**：
# Spring Boot 在 @ConfigurationProperties 绑定路径上会把解析不了的占位符原样保留
# （实测 `${MALL_JWT_SECRET}` 没注入时会变成字面量、应用照样启动），
# 所以真正的校验在 com.mall.core.config.ProductionConfigGuard —— 它在 prod 下校验
# mall.jwt.secret / spring.datasource.password 不是空、不是未解析占位符、不是开发默认值，
# 不满足就让应用启动失败。
# ============================================================
---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  enable: false
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
