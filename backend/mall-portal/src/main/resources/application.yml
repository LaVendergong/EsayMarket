server:
  port: 8090
spring:
  application:
    name: mall-portal
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: "521131"
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

mall:
  jwt:
    secret: mall-jwt-secret-change-me-please-0123456789abcdef
    expire-millis: 604800000
  order:
    # 未支付订单有效期（分钟），与 mall-admin 保持一致
    expire-minutes: 30
    timeout-job:
      # 超时关单只在 mall-admin 跑，前台应用关闭
      enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
knife4j:
  enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
