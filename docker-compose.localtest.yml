# ============================================================================
# 本地"部署测试"用的 compose（**不是**生产部署文件）
#
# 用途：在开发机上把生产那份 docker-compose.yml 原样跑起来验证一遍
#      （镜像构建、健康检查、initdb 迁移、prod profile 自检、nginx 反代、Cookie）。
#
# 为什么单独一份：开发机上 3306（本机 MySQL 服务）、8081/8090（本地 jar）、
# 5173（可能被别的项目占着）通常已经被占用，直接 `docker compose up` 会端口冲突。
# 这里把**宿主端口**全换成 1xxxx 段，容器内部端口不变，所以镜像与配置完全一致。
#
# 用法：
#   cp .env.example .env    # 填三个必填密钥
#   docker compose -p malltest -f docker-compose.localtest.yml up -d --build
#   # H5  http://localhost:15174    后台 http://localhost:15173
#   docker compose -p malltest -f docker-compose.localtest.yml down -v
# ============================================================================

name: malltest

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.0
    mem_limit: 640m
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      # 忽略客户端声明的字符集，统一按服务端默认（utf8mb4）处理连接。
      # 不加这个的话，initdb 用的 mysql 客户端会以 latin1 建连接，UTF-8 的种子数据被二次编码进库
      # （表面是乱码，实际是数据写坏了，且应用侧怎么改都救不回来）。见 docs §8 第 68 条。
      - --character-set-client-handshake=FALSE
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: mall
    ports:
      - "13306:3306"
    volumes:
      - mysql-data-localtest:/var/lib/mysql
      - ./sql:/opt/mall-sql:ro
      # 只挂「按版本号数字排序」的执行脚本，不直接挂 sql 目录：
      # 官方 entrypoint 按 glob 字典序跑 *.sql，V10 会跑到 V2 前面（部署测试抓到过）
      - ./deploy/initdb.sh:/docker-entrypoint-initdb.d/01-migrate.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  mall-admin:
    build:
      context: ./backend
      args:
        MODULE: mall-admin
    image: mall/mall-admin:localtest
    mem_limit: 768m
    environment:
      # 本地栈给 JVM 设上限：不设时默认按宿主机 1/4 算（能吃到 4GB），
      # 在这台 16GB 机器上会把 WSL 虚拟机挤到反复重启。生产环境按实际规格再调。
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
      SPRING_PROFILES_ACTIVE: prod,localtest
      MALL_DB_URL: "jdbc:mysql://mysql:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      MALL_DB_USERNAME: root
      MALL_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MALL_JWT_SECRET: ${MALL_JWT_SECRET:?set MALL_JWT_SECRET in .env}
      MALL_CRYPTO_SECRET: ${MALL_CRYPTO_SECRET:?set MALL_CRYPTO_SECRET in .env}
      # 与生产一致：登录态 Cookie 只在 HTTPS 下发送（浏览器把 localhost 视为安全上下文，仍可用）
      MALL_COOKIE_SECURE: "true"
      # 本地部署测试：站点自己的来源（15173/15174）。同源请求由 nginx 去掉 Origin，这里主要给
      # 「别的来源直接打接口」用；prod 自检会拒绝 *
      MALL_CORS_ALLOWED_ORIGINS: ${MALL_CORS_ALLOWED_ORIGINS:-http://localhost:15173,http://localhost:15174}
      MALL_ORDER_TIMEOUT_JOB_ENABLED: "true"
    ports:
      - "18081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  mall-portal:
    build:
      context: ./backend
      args:
        MODULE: mall-portal
    image: mall/mall-portal:localtest
    mem_limit: 768m
    environment:
      # 本地栈给 JVM 设上限：不设时默认按宿主机 1/4 算（能吃到 4GB），
      # 在这台 16GB 机器上会把 WSL 虚拟机挤到反复重启。生产环境按实际规格再调。
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC"
      SPRING_PROFILES_ACTIVE: prod,localtest
      MALL_DB_URL: "jdbc:mysql://mysql:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      MALL_DB_USERNAME: root
      MALL_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MALL_JWT_SECRET: ${MALL_JWT_SECRET:?set MALL_JWT_SECRET in .env}
      MALL_CRYPTO_SECRET: ${MALL_CRYPTO_SECRET:?set MALL_CRYPTO_SECRET in .env}
      MALL_COOKIE_SECURE: "true"
      # 本地部署测试：站点自己的来源（15173/15174）。同源请求由 nginx 去掉 Origin，这里主要给
      # 「别的来源直接打接口」用；prod 自检会拒绝 *
      MALL_CORS_ALLOWED_ORIGINS: ${MALL_CORS_ALLOWED_ORIGINS:-http://localhost:15173,http://localhost:15174}
    ports:
      - "18090:8090"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  admin-web:
    build:
      context: ./frontend/admin-web
    image: mall/admin-web:localtest
    mem_limit: 64m
    ports:
      # 443 是 https 入口；80 只做 http -> https 跳转
      - "15173:443"
      - "15177:80"
    volumes:
      # 用官方镜像的 templates 机制：启动时 envsubst 生成 default.conf，
      # 覆盖 Dockerfile 里那份纯 http 的配置
      - ./deploy/nginx-tls.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    environment:
      UPSTREAM: mall-admin:8081
      # 跳转要带上宿主机映射的端口，否则会跳到 443（容器内），浏览器连不上
      HTTPS_PORT: "15173"
    depends_on:
      - mall-admin
    restart: unless-stopped
    logging: *default-logging

  portal-web:
    build:
      context: ./frontend/portal-web
    image: mall/portal-web:localtest
    mem_limit: 64m
    ports:
      - "15174:443"
      - "15176:80"
    volumes:
      - ./deploy/nginx-tls.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    environment:
      UPSTREAM: mall-portal:8090
      HTTPS_PORT: "15174"
    depends_on:
      - mall-portal
    restart: unless-stopped
    logging: *default-logging

volumes:
  mysql-data-localtest:
