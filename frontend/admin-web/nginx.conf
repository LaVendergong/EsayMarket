server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（无功能风险的基础加固）：
    #   nosniff        禁止浏览器猜 MIME（防把上传内容当脚本执行）
    #   DENY           禁止被第三方站点 iframe 嵌套（防点击劫持）
    #   same-origin    跨站跳转时不带完整 URL（防把 token 带在 Referer 里泄露）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 前端是 hash 路由，正常不需要 rewrite；保留 try_files 以防直接访问子路径
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口：proxy_pass 不带路径，原样透传 /api/...
    location /api/ {
        proxy_pass http://mall-admin:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 商品演示图由后端当静态资源提供
    location /img/ {
        proxy_pass http://mall-admin:8081;
        proxy_set_header Host $host;
    }
}
