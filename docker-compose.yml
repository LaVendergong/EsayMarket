# Mall 商城一键起：MySQL + 两个后端 + 两个前端
#
#   cp .env.example .env      # 填好 MYSQL_ROOT_PASSWORD 与 MALL_JWT_SECRET（两个必填）
#   docker compose up -d --build
#   docker compose down       # 停止（保留数据）
#   docker compose down -v    # 停止并删库（重建时会重新执行 sql/）
#
# 起来之后的地址：
#   H5 商城      http://localhost:5174
#   管理后台     http://localhost:5173    账号 malladmin / admin123456
#   两个后端接口 :8081 / :8090
#   数据库       localhost:3306
#
# 说明：
#   - 后端跑在 prod profile：敏感项不给默认值（缺环境变量直接启动失败）、关闭接口文档。
#   - 不用 Redis（相关依赖已在 P6 移除）。
#   - 端口与本地开发一致（5173/5174/8081/8090/3306），方便对照文档。

name: mall

# 日志上限：docker 的 json-file 驱动**默认不限制**，长期跑会把宿主磁盘吃满（最常见的「半夜磁盘 100%」）。
# 后端自己还有一份滚动文件（backend/mall-core/.../logback-spring.xml），这里是 docker 层的第二道保险。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      # 必填：没有默认值，缺失时 compose 直接报错，不会用弱口令悄悄起来
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env (see .env.example)}
      MYSQL_DATABASE: mall
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # initdb 按文件名排序执行：V1__schema → V2 → V3(演示数据) → V4(索引) → V5(幂等键)
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  mall-admin:
    build:
      context: ./backend
      args:
        MODULE: mall-admin
    image: mall/mall-admin:1.0.0
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MALL_DB_URL: "jdbc:mysql://mysql:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      MALL_DB_USERNAME: root
      MALL_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MALL_JWT_SECRET: ${MALL_JWT_SECRET:?set MALL_JWT_SECRET in .env (see .env.example)}
      # 超时关单定时任务只在 admin 开，避免两个应用重复扫同一批订单
      MALL_ORDER_TIMEOUT_JOB_ENABLED: "true"
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  mall-portal:
    build:
      context: ./backend
      args:
        MODULE: mall-portal
    image: mall/mall-portal:1.0.0
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MALL_DB_URL: "jdbc:mysql://mysql:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      MALL_DB_USERNAME: root
      MALL_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 必须与 mall-admin 完全一致，否则前台签发的 token 后台认不了
      MALL_JWT_SECRET: ${MALL_JWT_SECRET:?set MALL_JWT_SECRET in .env (see .env.example)}
    ports:
      - "8090:8090"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  admin-web:
    build:
      context: ./frontend/admin-web
    image: mall/admin-web:1.0.0
    ports:
      - "5173:80"
    depends_on:
      - mall-admin
    restart: unless-stopped
    logging: *default-logging

  portal-web:
    build:
      context: ./frontend/portal-web
    image: mall/portal-web:1.0.0
    ports:
      - "5174:80"
    depends_on:
      - mall-portal
    restart: unless-stopped
    logging: *default-logging

volumes:
  mysql-data:
