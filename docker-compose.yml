# Mall 商城一键起：MySQL + 两个后端 + 两个前端
#
#   docker compose up -d --build        # 首次（会用 sql/ 下的脚本自动建库+灌演示数据）
#   docker compose down                 # 停止（保留数据）
#   docker compose down -v              # 停止并删库（重建时会重新执行 sql/）
#
# 起来之后的地址：
#   H5 商城      http://localhost:5174
#   管理后台     http://localhost:5173    账号 malladmin / admin123456
#   两个后端接口 :8081 / :8090 （doc.html 是接口文档）
#   数据库       localhost:3306（root / 见 MYSQL_ROOT_PASSWORD，默认 521131）
#
# 说明：
#   - 不用 Redis。项目引了 starter 但代码里没有任何使用点，实测 /actuator/health 仍是 UP。
#   - 端口和本地开发保持一致（5173/5174/8081/8090/3306），方便直接对照文档。
#   - 口令可用环境变量覆盖：MYSQL_ROOT_PASSWORD=xxx docker compose up -d

name: mall

services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-521131}
      MYSQL_DATABASE: mall
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # initdb 按文件名排序执行：V1__schema → V2 → V3(演示数据) → V4
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mall-admin:
    build:
      context: ./backend
      args:
        MODULE: mall-admin
    image: mall/mall-admin:1.0.0
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-521131}
      # 超时关单定时任务只在 admin 开，避免两个应用重复扫同一批订单
      MALL_ORDER_TIMEOUT_JOB_ENABLED: "true"
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mall-portal:
    build:
      context: ./backend
      args:
        MODULE: mall-portal
    image: mall/mall-portal:1.0.0
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-521131}
    ports:
      - "8090:8090"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  admin-web:
    build:
      context: ./frontend/admin-web
    image: mall/admin-web:1.0.0
    ports:
      - "5173:80"
    depends_on:
      - mall-admin
    restart: unless-stopped

  portal-web:
    build:
      context: ./frontend/portal-web
    image: mall/portal-web:1.0.0
    ports:
      - "5174:80"
    depends_on:
      - mall-portal
    restart: unless-stopped

volumes:
  mysql-data:
